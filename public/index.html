<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KisanSetu</title><link rel="stylesheet" href="style.css"></head><body><main id="authPage" class="auth"><section class="card"><h1>🌾 KisanSetu</h1><p>Farmer Procurement Portal</p><form id="loginForm"><h2>Welcome back</h2><label>Phone number</label><input id="loginPhone" maxlength="10" placeholder="10-digit mobile number" required><label>Password</label><input id="loginPassword" type="password" placeholder="Your password" required><button>Login to KisanSetu</button><p>New farmer? <button type="button" class="link" id="showRegister">Create your account</button></p><p>Officer? <a href="officer.html">Open Officer Portal</a></p><p id="loginError"></p></form><form id="registerForm" class="hidden"><h2>Create farmer account</h2><label>Full name</label><input id="registerName" required><label>Phone number</label><input id="registerPhone" maxlength="10" required><label>Village</label><input id="registerVillage" required><label>Password</label><input id="registerPassword" type="password" minlength="6" required><button>Create my account</button><p>Already registered? <button type="button" class="link" id="showLogin">Log in</button></p><p id="registerError"></p></form></section></main><main id="appPage" class="hidden"><header><b>🌾 KisanSetu</b><button id="logoutBtn">Logout</button></header><section class="dash"><h2 id="welcomeName"></h2><p id="farmerInfo"></p><div class="grid"><div class="panel"><h3>New procurement request</h3><form id="requestForm"><input id="crop" placeholder="Crop e.g. Wheat" required><input id="quantity" type="number" min="1" placeholder="Quantity in kg" required><button>Submit request</button><p id="requestMessage"></p></form></div><div class="panel"><h3>My requests</h3><div id="requests"></div></div></div></section></main><script src="script.js"></script></body></html>
